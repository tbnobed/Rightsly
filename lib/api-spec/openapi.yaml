openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `application/pdf`).

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Short-lived URL for an authenticated PUT upload using the configured storage backend.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`).
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    ContractAttachment:
      type: object
      required: [id, contractId, fileName, objectPath, createdAt]
      properties:
        id:
          type: string
        contractId:
          type: string
        fileName:
          type: string
        objectPath:
          type: string
        contentType:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
        uploadedByName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateContractAttachmentRequest:
      type: object
      required: [fileName, objectPath]
      properties:
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
        contentType:
          type: string
        size:
          type: integer

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginData:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, content_admin, legal, finance, sales]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time
          nullable: true
        invitePending:
          type: boolean

    CreateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, content_admin, legal, finance, sales]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [admin, content_admin, legal, finance, sales]
        isActive:
          type: boolean
        password:
          type: string

    Partner:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [Licensor, Licensee, Both]
        website:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        contractCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Contact:
      type: object
      required: [id, name, company, title, email, phone, notes, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: UUID identifier.
        name:
          type: string
        company:
          type: [string, "null"]
        title:
          type: [string, "null"]
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContactInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        company:
          type: [string, "null"]
          maxLength: 200
        title:
          type: [string, "null"]
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 320
        phone:
          type: [string, "null"]
          maxLength: 50
        notes:
          type: [string, "null"]
          maxLength: 5000

    ContactUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        company:
          type: [string, "null"]
          maxLength: 200
        title:
          type: [string, "null"]
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 320
        phone:
          type: [string, "null"]
          maxLength: 50
        notes:
          type: [string, "null"]
          maxLength: 5000

    ContactImportCandidate:
      type: object
      required: [id, sourceKey, name, company, email, notes, ambiguous, duplicateContactId, duplicateCandidateId, warnings]
      properties:
        id: { type: string }
        sourceKey: { type: string }
        name: { type: string }
        company: { type: string }
        email: { type: [string, "null"] }
        notes: { type: string }
        ambiguous: { type: boolean }
        duplicateContactId: { type: [string, "null"] }
        duplicateCandidateId: { type: [string, "null"] }
        warnings:
          type: array
          items: { type: string }

    ContactImportPreview:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ContactImportCandidate'

    ContactImportApproval:
      type: object
      required: [candidateIds]
      properties:
        candidateIds:
          type: array
          maxItems: 500
          items: { type: string }

    ContactImportResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer }
        skipped: { type: integer }

    ContactListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CreatePartnerRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [Licensor, Licensee, Both]
        website:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    UpdatePartnerRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [Licensor, Licensee, Both]
        website:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    ContentItem:
      type: object
      required: [id, type, title, contentSource, tbnMediaId, notes, catalogImportKey, catalogInternalId, mediaFormat, genres, director, actors, releaseDate, contentRating, broadcastRightsDuration, broadcastRightsTerm, broadcastRightsCustomTerm, digitalRightsDuration, digitalRightsTerm, digitalRightsCustomTerm, internationalRightsDuration, internationalRightsTerm, internationalRightsCustomTerm, internationalBroadcastAirAmount, youtubeRightsDuration, youtubeRightsTerm, youtubeRightsCustomTerm, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [Film, TVSeries, TBN_FAST, TBN_Linear, WoF_FAST]
        title:
          type: string
        description:
          type: string
          nullable: true
        contentSource:
          type: [string, "null"]
          enum: [tbn, third_party, null]
        tbnMediaId:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        catalogImportKey:
          type: [string, "null"]
        catalogInternalId:
          type: [string, "null"]
        mediaFormat:
          type: [string, "null"]
        genres:
          type: [string, "null"]
        director:
          type: [string, "null"]
        actors:
          type: [string, "null"]
        releaseDate:
          type: [string, "null"]
          format: date
        contentRating:
          type: [string, "null"]
        broadcastRightsDuration: { type: [integer, "null"], minimum: 1 }
        broadcastRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        broadcastRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        digitalRightsDuration: { type: [integer, "null"], minimum: 1 }
        digitalRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        digitalRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        internationalRightsDuration: { type: [integer, "null"], minimum: 1 }
        internationalRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        internationalRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        internationalBroadcastAirAmount: { type: [integer, "null"], minimum: 1 }
        youtubeRightsDuration: { type: [integer, "null"], minimum: 1 }
        youtubeRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        youtubeRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        year:
          type: integer
          nullable: true
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/Season'
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
        contractCount:
          type: integer
        hasCleans:
          type: boolean
        hasCaptions:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContractContentItem:
      type: object
      required: [id, type, title, year]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [Film, TVSeries, TBN_FAST, TBN_Linear, WoF_FAST]
        title:
          type: string
        year:
          type: [integer, "null"]

    Season:
      type: object
      required: [id, contentItemId, seasonNumber]
      properties:
        id:
          type: string
        contentItemId:
          type: string
        seasonNumber:
          type: integer
        title:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        episodeCount:
          type: integer
          nullable: true

    Episode:
      type: object
      required: [id, contentItemId, seasonId, catalogKey, internalId, episodeNumber, episodeNumberText, title, description, mediaFormat, genres, director, actors, year, releaseDate, contentRating, sourceSheet, sourceRow, createdAt, updatedAt]
      properties:
        id: { type: string }
        contentItemId: { type: string }
        seasonId: { type: [string, "null"] }
        catalogKey: { type: string }
        internalId: { type: [string, "null"] }
        episodeNumber: { type: [integer, "null"] }
        episodeNumberText: { type: [string, "null"] }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        mediaFormat: { type: [string, "null"] }
        genres: { type: [string, "null"] }
        director: { type: [string, "null"] }
        actors: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        releaseDate: { type: [string, "null"], format: date }
        contentRating: { type: [string, "null"] }
        sourceSheet: { type: string }
        sourceRow: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateContentItemRequest:
      type: object
      required: [type, title, contentSource]
      properties:
        type:
          type: string
          enum: [Film, TVSeries, TBN_FAST, TBN_Linear, WoF_FAST]
        title:
          type: string
        description:
          type: string
          nullable: true
        contentSource:
          type: string
          enum: [tbn, third_party]
        tbnMediaId: { type: [string, "null"], maxLength: 200 }
        notes: { type: [string, "null"], maxLength: 5000 }
        catalogInternalId: { type: [string, "null"], maxLength: 200 }
        mediaFormat: { type: [string, "null"], maxLength: 100 }
        genres: { type: [string, "null"], maxLength: 1000 }
        director: { type: [string, "null"], maxLength: 500 }
        actors: { type: [string, "null"], maxLength: 2000 }
        releaseDate: { type: [string, "null"], format: date }
        contentRating: { type: [string, "null"], maxLength: 100 }
        broadcastRightsDuration: { type: [integer, "null"], minimum: 1 }
        broadcastRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        broadcastRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        digitalRightsDuration: { type: [integer, "null"], minimum: 1 }
        digitalRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        digitalRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        internationalRightsDuration: { type: [integer, "null"], minimum: 1 }
        internationalRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        internationalRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        internationalBroadcastAirAmount: { type: [integer, "null"], minimum: 1 }
        youtubeRightsDuration: { type: [integer, "null"], minimum: 1 }
        youtubeRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        youtubeRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        year:
          type: integer
          nullable: true
        hasCleans:
          type: boolean
        hasCaptions:
          type: boolean
        seasons:
          type: array
          items:
            type: object
            required: [seasonNumber]
            properties:
              id:
                type: string
              seasonNumber:
                type: integer
              title:
                type: string
                nullable: true
              year:
                type: integer
                nullable: true
              episodeCount:
                type: integer
                nullable: true

    UpdateContentItemRequest:
      type: object
      properties:
        type:
          type: string
          enum: [Film, TVSeries, TBN_FAST, TBN_Linear, WoF_FAST]
        title:
          type: string
        description:
          type: string
          nullable: true
        contentSource:
          type: string
          enum: [tbn, third_party]
        tbnMediaId: { type: [string, "null"], maxLength: 200 }
        notes: { type: [string, "null"], maxLength: 5000 }
        catalogInternalId: { type: [string, "null"], maxLength: 200 }
        mediaFormat: { type: [string, "null"], maxLength: 100 }
        genres: { type: [string, "null"], maxLength: 1000 }
        director: { type: [string, "null"], maxLength: 500 }
        actors: { type: [string, "null"], maxLength: 2000 }
        releaseDate: { type: [string, "null"], format: date }
        contentRating: { type: [string, "null"], maxLength: 100 }
        broadcastRightsDuration: { type: [integer, "null"], minimum: 1 }
        broadcastRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        broadcastRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        digitalRightsDuration: { type: [integer, "null"], minimum: 1 }
        digitalRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        digitalRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        internationalRightsDuration: { type: [integer, "null"], minimum: 1 }
        internationalRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        internationalRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        internationalBroadcastAirAmount: { type: [integer, "null"], minimum: 1 }
        youtubeRightsDuration: { type: [integer, "null"], minimum: 1 }
        youtubeRightsTerm: { type: [string, "null"], enum: [months, years, in_perpetuity, null] }
        youtubeRightsCustomTerm: { type: [string, "null"], maxLength: 50 }
        year:
          type: integer
          nullable: true
        hasCleans:
          type: boolean
        hasCaptions:
          type: boolean
        seasons:
          type: array
          items:
            type: object
            required: [seasonNumber]
            properties:
              id:
                type: string
              seasonNumber:
                type: integer
              title:
                type: string
                nullable: true
              year:
                type: integer
                nullable: true
              episodeCount:
                type: integer
                nullable: true

    Contract:
      type: object
      required: [id, direction, partnerId, status, endType, createdAt]
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [rights_in, rights_out]
        partnerId:
          type: string
        partnerName:
          type: string
        licensor:
          type: string
          nullable: true
        licensee:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, expired, in_perpetuity, terminated]
        startDate:
          type: string
          format: date
          nullable: true
        endType:
          type: string
          enum: [date, perpetuity, auto_renew]
        endDate:
          type: string
          format: date
          nullable: true
        territories:
          type: array
          items:
            type: string
        otherTerritories:
          type: string
          nullable: true
        distributionTypes:
          type: array
          items:
            type: string
        platform:
          type: string
          nullable: true
        royaltyType:
          type: string
          enum: [revenue_share, flat_fee, other]
          nullable: true
        royaltyDetails:
          type: string
          nullable: true
        paymentTerms:
          type: string
          enum: [net_30, net_60, net_90]
          nullable: true
        notes:
          type: string
          nullable: true
        documentUrl:
          type: string
          nullable: true
        websiteLink:
          type: string
          nullable: true
        departmentTags:
          type: array
          items:
            type: string
        archived:
          type: boolean
        rightsInDetails:
          $ref: '#/components/schemas/RightsInDetails'
          nullable: true
        rightsOutDetails:
          $ref: '#/components/schemas/RightsOutDetails'
          nullable: true
        contentItems:
          type: array
          items:
            $ref: '#/components/schemas/ContractContentItem'
        selectedSeasons:
          type: array
          items:
            $ref: '#/components/schemas/Season'
        amendments:
          type: array
          items:
            $ref: '#/components/schemas/Amendment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true

    RightsInDetails:
      type: object
      properties:
        platforms:
          type: array
          items:
            type: string
        youtubeChannel:
          type: string
          nullable: true
        socialPlatforms:
          type: array
          items:
            type: string
        socialHandle:
          type: string
          nullable: true
        socialAccounts:
          type: object
          additionalProperties:
            type: string
        grantOfRights:
          type: string
          nullable: true
        exclusivityStartDate:
          type: string
          format: date
          nullable: true
        exclusivityEndDate:
          type: string
          format: date
          nullable: true
        exclusivitySameAsDuration:
          type: boolean
        marketingRights:
          type: string
          nullable: true

    RightsOutDetails:
      type: object
      properties:
        autoRenew:
          type: boolean
        hasAmendment:
          type: boolean
        exclusivity:
          type: string
          enum: [exclusive, non_exclusive]
          nullable: true
        reportingFrequency:
          type: string
          enum: [monthly, quarterly, annually]
          nullable: true
        minPaymentThreshold:
          type: number
          nullable: true

    CreateContractRequest:
      type: object
      required: [direction, partnerId, endType]
      properties:
        direction:
          type: string
          enum: [rights_in, rights_out]
        partnerId:
          type: string
        licensor:
          type: string
          nullable: true
        licensee:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, expired, in_perpetuity, terminated]
        startDate:
          type: string
          format: date
          nullable: true
        endType:
          type: string
          enum: [date, perpetuity, auto_renew]
        endDate:
          type: string
          format: date
          nullable: true
        territories:
          type: array
          items:
            type: string
        otherTerritories:
          type: string
          nullable: true
        distributionTypes:
          type: array
          items:
            type: string
        platform:
          type: string
          nullable: true
        royaltyType:
          type: string
          enum: [revenue_share, flat_fee, other]
          nullable: true
        royaltyDetails:
          type: string
          nullable: true
        paymentTerms:
          type: string
          enum: [net_30, net_60, net_90]
          nullable: true
        notes:
          type: string
          nullable: true
        websiteLink:
          type: string
          nullable: true
        rightsInDetails:
          $ref: '#/components/schemas/RightsInDetails'
          nullable: true
        rightsOutDetails:
          $ref: '#/components/schemas/RightsOutDetails'
          nullable: true
        contentItemIds:
          type: array
          items:
            type: string
        seasonIds:
          type: array
          items:
            type: string
        departmentTags:
          type: array
          items:
            type: string

    UpdateContractRequest:
      type: object
      properties:
        partnerId:
          type: string
        licensor:
          type: string
          nullable: true
        licensee:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, expired, in_perpetuity, terminated]
        startDate:
          type: string
          format: date
          nullable: true
        endType:
          type: string
          enum: [date, perpetuity, auto_renew]
        endDate:
          type: string
          format: date
          nullable: true
        territories:
          type: array
          items:
            type: string
        otherTerritories:
          type: string
          nullable: true
        distributionTypes:
          type: array
          items:
            type: string
        platform:
          type: string
          nullable: true
        royaltyType:
          type: string
          enum: [revenue_share, flat_fee, other]
          nullable: true
        royaltyDetails:
          type: string
          nullable: true
        paymentTerms:
          type: string
          enum: [net_30, net_60, net_90]
          nullable: true
        notes:
          type: string
          nullable: true
        websiteLink:
          type: string
          nullable: true
        rightsInDetails:
          $ref: '#/components/schemas/RightsInDetails'
          nullable: true
        rightsOutDetails:
          $ref: '#/components/schemas/RightsOutDetails'
          nullable: true
        contentItemIds:
          type: array
          items:
            type: string
        seasonIds:
          type: array
          items:
            type: string
        departmentTags:
          type: array
          items:
            type: string
        archived:
          type: boolean

    ContractListItem:
      type: object
      required: [id, direction, status, endType, createdAt]
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [rights_in, rights_out]
        partnerId:
          type: string
        platform:
          type: string
          nullable: true
        partnerName:
          type: string
        licensor:
          type: string
          nullable: true
        licensee:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, expired, in_perpetuity, terminated]
        startDate:
          type: string
          format: date
          nullable: true
        endType:
          type: string
          enum: [date, perpetuity, auto_renew]
        endDate:
          type: string
          format: date
          nullable: true
        territories:
          type: array
          items:
            type: string
        distributionTypes:
          type: array
          items:
            type: string
        royaltyType:
          type: string
          nullable: true
        contentCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    Amendment:
      type: object
      required: [id, contractId, date, description, createdAt]
      properties:
        id:
          type: string
        contractId:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        documentUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true

    CreateAmendmentRequest:
      type: object
      required: [date, description]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        documentUrl:
          type: string
          nullable: true

    RevenueReport:
      type: object
      required: [id, contractId, period, status, createdAt]
      properties:
        id:
          type: string
        contractId:
          type: string
        partnerName:
          type: string
          nullable: true
        period:
          type: string
        periodStart:
          type: string
          format: date
          nullable: true
        periodEnd:
          type: string
          format: date
          nullable: true
        expectedDate:
          type: string
          format: date
          nullable: true
        receivedDate:
          type: string
          format: date
          nullable: true
        amountReceived:
          type: number
          nullable: true
        costAmount:
          type: number
          nullable: true
        status:
          type: string
          enum: [expected, received, overdue]
        scheduleGenerated:
          type: boolean
        documentPath:
          type: string
          nullable: true
        documentName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateRevenueReportRequest:
      type: object
      required: [period, status]
      properties:
        period:
          type: string
        periodStart:
          type: string
          format: date
          nullable: true
        periodEnd:
          type: string
          format: date
          nullable: true
        expectedDate:
          type: string
          format: date
          nullable: true
        receivedDate:
          type: string
          format: date
          nullable: true
        amountReceived:
          type: number
          minimum: 0
          nullable: true
        costAmount:
          type: number
          minimum: 0
          nullable: true
        status:
          type: string
          enum: [expected, received, overdue]
        scheduleGenerated:
          type: boolean

    UpdateRevenueReportRequest:
      type: object
      properties:
        period:
          type: string
        expectedDate:
          type: string
          format: date
          nullable: true
        receivedDate:
          type: string
          format: date
          nullable: true
        amountReceived:
          type: number
          minimum: 0
          nullable: true
        costAmount:
          type: number
          minimum: 0
          nullable: true
        status:
          type: string
          enum: [expected, received, overdue]
        documentPath:
          type: string
          nullable: true
        documentName:
          type: string
          nullable: true

    ReviewedRevenueReport:
      type: object
      required: [id, contractId, period, status, reviewStatus, createdAt]
      properties:
        id:
          type: string
        contractId:
          type: string
        period:
          type: string
        expectedDate:
          type: string
          format: date
          nullable: true
        receivedDate:
          type: string
          format: date
          nullable: true
        amountReceived:
          type: number
          nullable: true
        costAmount:
          type: number
          nullable: true
        status:
          type: string
          enum: [expected, received, overdue]
        reviewStatus:
          type: string
          enum: [pending, reviewed, approved]
        reviewedBy:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        documentPath:
          type: string
          nullable: true
        documentName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    RevenueReviewQueue:
      type: object
      required: [contractId, partnerName, reports]
      properties:
        contractId:
          type: string
        partnerName:
          type: string
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReviewedRevenueReport'

    ReviewRevenueReportRequest:
      type: object
      required: [reportId, status]
      properties:
        reportId:
          type: string
        status:
          type: string
          enum: [reviewed, approved]

    RightsCheckResult:
      type: object
      required: [available, conflicts, grants, acquisition, suggestions]
      properties:
        available:
          type: boolean
        conflicts:
          type: array
          items:
            type: object
            required: [contractId, partnerName, reason]
            properties:
              contractId:
                type: string
              partnerName:
                type: string
              reason:
                type: string
              territory:
                type: string
                nullable: true
              distributionType:
                type: string
                nullable: true
        grants:
          type: array
          items:
            type: object
            required: [contractId, partnerName, direction]
            properties:
              contractId:
                type: string
              partnerName:
                type: string
              direction:
                type: string
              exclusivity:
                type: string
                nullable: true
              territories:
                type: array
                items:
                  type: string
              distributionTypes:
                type: array
                items:
                  type: string
              startDate:
                type: string
                format: date
                nullable: true
              endDate:
                type: string
                format: date
                nullable: true
              seasonIds:
                type: array
                items:
                  type: string
        acquisition:
          type: object
          required: [required, covered, warning]
          properties:
            required:
              type: boolean
              description: Whether Rights In acquisition coverage is required before outbound licensing.
            covered:
              type: boolean
              description: Whether an active Rights In grant covers the requested season, date, territory, and distribution type.
            warning:
              type: string
              nullable: true
              description: Clear reason the request lacks required acquisition coverage.
        suggestions:
          type: object
          required: [availableTerritories, availableDistributionTypes]
          properties:
            availableTerritories:
              type: array
              items:
                type: string
            availableDistributionTypes:
              type: array
              items:
                type: string

    DashboardSummary:
      type: object
      required: [activeContracts, expiringSoon, upcomingReports, draftContracts]
      properties:
        activeContracts:
          type: integer
        expiringSoon:
          type: integer
        upcomingReports:
          type: integer
        draftContracts:
          type: integer
        totalRightsIn:
          type: integer
        totalRightsOut:
          type: integer
        calendarEvents:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
        expiringSoonContracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractListItem'
        rightsInSpans:
          type: array
          items:
            $ref: '#/components/schemas/RightsInSpan'

    RightsInSpan:
      type: object
      required: [contractId, platforms, startDate]
      properties:
        contractId:
          type: string
        partnerName:
          type: string
          nullable: true
        platforms:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        endType:
          type: string
          nullable: true

    CalendarEvent:
      type: object
      required: [id, type, title, date]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [contract_start, contract_expiry, revenue_report_expected, revenue_report_overdue]
        title:
          type: string
        date:
          type: string
          format: date
        contractId:
          type: string
          nullable: true
        partnerName:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        platforms:
          type: array
          items:
            type: string

    Notification:
      type: object
      required: [id, type, title, read, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [contract_expiring, report_expected, approval_needed, general]
        title:
          type: string
        message:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      required: [id, action, entityType, entityId, timestamp]
      properties:
        id:
          type: string
        userId:
          type: string
          nullable: true
        userEmail:
          type: string
          nullable: true
        userName:
          type: string
          nullable: true
        action:
          type: string
          enum: [create, update, delete, status_change, login, logout, export]
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        beforeSummary:
          type: string
          nullable: true
        afterSummary:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    ContractImportInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    CatalogImportPreview:
      type: object
      required: [total, ready, duplicates, invalid, titleCount, episodic, standalone, errors, warnings]
      properties:
        total: { type: integer }
        ready: { type: integer }
        duplicates: { type: integer }
        invalid: { type: integer }
        titleCount: { type: integer }
        episodic: { type: integer }
        standalone: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ImportIssue' }

    CatalogImportResult:
      type: object
      required: [imported, failed, duplicates, titlesCreated, titlesUpdated, episodesCreated, episodesUpdated, errors, warnings]
      properties:
        imported: { type: integer }
        failed: { type: integer }
        duplicates: { type: integer }
        titlesCreated: { type: integer }
        titlesUpdated: { type: integer }
        episodesCreated: { type: integer }
        episodesUpdated: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ImportIssue' }

    ImportResult:
      type: object
      required: [imported, failed, skipped, review, duplicates, errors, warnings, createdPartners, linkedContent, linkedSeasons]
      properties:
        imported:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        review:
          type: integer
        duplicates:
          type: integer
        createdPartners:
          type: integer
          description: Number of previously unknown partners created while importing.
        linkedContent:
          type: integer
        linkedSeasons:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'

    ImportIssue:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
        message:
          type: string

    ImportPreview:
      type: object
      required: [total, ready, review, skipped, invalid, errors, warnings]
      properties:
        total:
          type: integer
        ready:
          type: integer
        review:
          type: integer
        skipped:
          type: integer
        invalid:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'

    PaginatedContracts:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContractListItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ContractFilterOptions:
      type: object
      required: [territories, licensors]
      properties:
        territories:
          type: array
          items:
            type: string
        licensors:
          type: array
          items:
            type: string

    PaginatedPartners:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Partner'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PaginatedContent:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PaginatedAuditLogs:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PaginatedRevenueReports:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RevenueReport'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginData'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Set a password and accept a user invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginData'
        '400':
          description: Invalid or expired invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sso/config:
    get:
      operationId: getSsoConfig
      summary: Get SSO configuration status
      security: []
      responses:
        '200':
          description: SSO configuration status
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean

  /auth/logout:
    post:
      operationId: logout
      summary: Logout current user
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
    post:
      operationId: createUser
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      operationId: getUser
      summary: Get user by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateUser
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      operationId: deleteUser
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /partners:
    get:
      operationId: listPartners
      summary: List all partners
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [Licensor, Licensee, Both]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, type, website, contractCount, updatedAt]
            default: name
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Paginated partner list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPartners'
    post:
      operationId: createPartner
      summary: Create a new partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerRequest'
      responses:
        '201':
          description: Created partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contacts:
    get:
      operationId: listContacts
      summary: List contacts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, company, title, updatedAt]
            default: name
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Paginated contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createContact
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Created contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contacts/import-candidates:
    get:
      operationId: previewContactImport
      summary: Preview contact candidates extracted from legacy partner notes
      responses:
        '200':
          description: Contact import candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportPreview'
    post:
      operationId: approveContactImport
      summary: Create approved contacts from legacy partner notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactImportApproval'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactImportResult'
  /contacts/{id}:
    get:
      operationId: getContact
      summary: Get a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: UUID identifier.
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateContact
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: UUID identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteContact
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: UUID identifier.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partners/{id}:
    get:
      operationId: getPartner
      summary: Get partner by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Partner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updatePartner
      summary: Update partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerRequest'
      responses:
        '200':
          description: Updated partner
          content:
            application/json:
